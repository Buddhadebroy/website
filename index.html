<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Websites</title>
<style>
:root{--ink:#16112e;--mut:#6b6684;--line:#e7e4f0;--bg:#f8f7fc}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;padding:24px 16px}
main{width:100%;max-width:720px}
h1{font-size:28px;margin:0 0 6px;letter-spacing:-.02em}
p{color:var(--mut);margin:0 0 24px}
.sites{display:grid;grid-template-columns:1fr 1fr;gap:16px}
a{display:block;background:#fff;border:1px solid var(--line);border-radius:16px;padding:22px;color:inherit;text-decoration:none;transition:border-color .2s,box-shadow .2s}
a:hover{border-color:var(--c);box-shadow:0 10px 30px -12px rgba(22,17,46,.25)}
a i{display:block;width:40px;height:40px;border-radius:11px;background:var(--c);margin-bottom:14px}
a b{font-size:18px;display:block}
a span{color:var(--mut);font-size:14px}
@media (max-width:560px){.sites{grid-template-columns:1fr}}
</style>
</head>
<body>
<main>
  <h1>Websites</h1>
  <p>Pick a site to open.</p>
  <div class="sites">
    <a href="multivendorx/" style="--c:#7b2ff7"><i></i><b>MultiVendorX</b><span>multivendorx/</span></a>
    <a href="catalogx/" style="--c:#5e2ede"><i></i><b>CatalogX</b><span>catalogx/</span></a>
    <a href="notifima/" style="--c:#7b2ff2"><i></i><b>Notifima</b><span>notifima/</span></a>
    <a href="purnendudash/" style="--c:#c2410c"><i></i><b>Purnendu Dash</b><span>purnendudash/</span></a>
  </div>
</main>
</body>
</html>
