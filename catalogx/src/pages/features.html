<section class="phero center">
  <div class="wrap phero-c rv">
    <div class="crumbs" style="justify-content:center"><a href="index.html">Home</a>/<span>Features</span></div>
    <span class="eyebrow"><span class="dot"></span>All features</span>
    <h1>Every CatalogX feature, <span class="hl">one page</span></h1>
    <p class="lead">Filter by module, Free or Pro, or search.</p>
    <div class="btns"><a class="btn btn-p" href="pricing.html">See pricing {i:arrow}</a><a class="btn btn-o" href="#">{i:eye} See It Live</a></div>
  </div>
</section>
<section class="sec flush">
  <div class="wrap fx-wrap">
    <div class="fx-bar">
      <div class="fx-cats">
        <button class="fx-cat on" type="button" data-cat="all">All <em></em></button>
        <button class="fx-cat" type="button" data-cat="catalog">Catalog <em></em></button>
        <button class="fx-cat" type="button" data-cat="enquiry">Enquiry <em></em></button>
        <button class="fx-cat" type="button" data-cat="quotation">Quotation <em></em></button>
        <button class="fx-cat" type="button" data-cat="wholesale">Wholesale <em></em></button>
        <button class="fx-cat" type="button" data-cat="pricing">Dynamic Pricing <em></em></button>
        <button class="fx-cat" type="button" data-cat="builder">Builder &amp; Blocks <em></em></button>
      </div>
      <div class="fx-tier"><button class="on" type="button" data-tier="all">All</button><button type="button" data-tier="free">Free</button><button type="button" data-tier="pro">Pro</button></div>
      <label class="fx-search">{i:search}<span class="sr">Search features</span><input type="search" placeholder="Search features"></label>
    </div>
    <p class="fx-count">Showing <b></b> features</p>
    <div class="fx-list">
{FEATURES}
    </div>
    <div class="fx-empty">No features match. Try another module or clear the search.</div>
  </div>
</section>
